# =============================================================================
# Apache Jena Fuseki 5.1.0 - shiro.ini (C-UAS Ontology 专用)
# =============================================================================
# 部署规则:
#   - /cuas/query, /cuas/sparql, /cuas/**  : 匿名 (便于演示 + curl)
#   - /$/ping, /$/stats                     : 匿名 (健康检查)
#   - /cuas/update, /cuas/data, /cuas/upload: admin 认证
#   - /$/datasets/**, /$/admin/**           : admin 认证
#   - 其他路径                               : 兜底匿名
# =============================================================================
# 重要修复记录 (v1.0 -> v1.1, 2026-08-06):
#   v1.0 的 [main] 段中错误地写了两行:
#     1) iniRealm=org.apache.shiro.realm.text.IniRealm
#     2) iniRealm.iniPath = $FUSEKI_BASE/shiro.ini
#   Shiro 2.x 的 IniRealm 类没有 iniPath 属性 (只有 resourcePath),
#   且显式声明 iniRealm 后再设置属性会触发启动错误:
#     "Property 'iniPath' does not exist for object of type IniRealm"
#   v1.1 修复方案 (与 stain 镜像官方做法一致):
#     - 不显式声明 iniRealm 类 (由 Shiro 内部自动管理)
#     - 仅保留 iniRealm.credentialsMatcher 属性
#     - 完全删除 iniPath 配置
# =============================================================================

[main]
# 禁用 SSL（生产环境建议反代层启用 TLS）
ssl.enabled = false

# 明文密码匹配器（生产环境可换 BCrypt）
plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher
# 只设置 credentialsMatcher, 不显式声明 iniRealm 类
iniRealm.credentialsMatcher = $plainMatcher

# -----------------------------------------------------------------------------
# 用户定义
# admin 密码由 init-fuseki.sh 通过 envsubst 注入
# -----------------------------------------------------------------------------
[users]
admin = ${ADMIN_PASSWORD}

# -----------------------------------------------------------------------------
# 角色定义
# -----------------------------------------------------------------------------
[roles]
admin = admin

# -----------------------------------------------------------------------------
# URL 授权规则
# -----------------------------------------------------------------------------
[urls]
# ---- 公共端点 (匿名访问) ----
/$/status = anon
/$/ping = anon
/$/ping/** = anon
/$/stats = anon
/$/stats/** = anon
# ---- SPARQL Query 端点 (匿名访问, 便于 curl 验证) ----
/cuas = anon
/cuas/** = anon
/cuas/query = anon
# ---- 管理端点 (需要 admin 认证) ----
/$/datasets = authcBasic
/$/datasets/** = authcBasic
/$/server = authcBasic
/$/server/** = authcBasic
/$/admin = authcBasic
/$/admin/** = authcBasic
/$/tasks = authcBasic
/$/tasks/** = authcBasic
# ---- SPARQL Update & 数据写入端点 (需要 admin 认证) ----
/cuas/update = authcBasic
/cuas/data = authcBasic
/cuas/data/** = authcBasic
/cuas/upload = authcBasic
# ---- 静态资源 (匿名) ----
/static/** = anon
/index.html = anon
/favicon.ico = anon
# ---- 兜底 ----
/** = anon
