<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="C-UAS Ontology 沉浸式 3D 体验 — 反无人机体系本体模型 AR/VR 应用" />
  <title>🛡️ C-UAS Ontology · 沉浸式 3D 体验</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <style>
    :root {
      --c-bg-0: #02060c;
      --c-bg-1: #0a1525;
      --c-accent: #1abc9c;
      --c-warn: #e74c3c;
      --c-info: #3498db;
      --c-text: #ecf0f1;
      --c-text-dim: #bdc3c7;
      --glass-bg: rgba(10, 21, 37, 0.55);
      --glass-border: rgba(26, 188, 156, 0.35);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at top, var(--c-bg-1) 0%, var(--c-bg-0) 70%);
      color: var(--c-text);
      font-family: 'Noto Sans CJK SC', 'Source Han Sans CN', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    canvas { display: block; }

    /* ============ 沉浸式 UI 面板 ============ */
    .panel {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      padding: 18px 22px;
      min-width: 320px;
      max-width: 360px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      pointer-events: auto;
    }
    .panel h1 {
      margin: 0 0 4px 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--c-accent);
    }
    .panel .sub {
      font-size: 12px;
      color: var(--c-text-dim);
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .panel .badge {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(26, 188, 156, 0.18);
      border: 1px solid rgba(26, 188, 156, 0.45);
      border-radius: 8px;
      font-size: 10px;
      color: var(--c-accent);
      margin-right: 4px;
    }
    .scene-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--c-text);
      background: linear-gradient(135deg, rgba(26, 188, 156, 0.18), rgba(52, 152, 219, 0.18));
      border: 1px solid rgba(26, 188, 156, 0.4);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: linear-gradient(135deg, rgba(26, 188, 156, 0.35), rgba(52, 152, 219, 0.35));
      border-color: var(--c-accent);
      transform: translateY(-1px);
    }
    .btn:active { transform: translateY(0); }
    .btn.full { grid-column: 1 / -1; }
    .btn .emoji { font-size: 16px; }
    .btn.vr {
      background: linear-gradient(135deg, rgba(231, 76, 60, 0.25), rgba(155, 89, 182, 0.25));
      border-color: rgba(231, 76, 60, 0.55);
      color: #ffd1cb;
    }
    .btn.vr:hover {
      background: linear-gradient(135deg, rgba(231, 76, 60, 0.45), rgba(155, 89, 182, 0.45));
    }

    /* ============ 右下角信息卡 ============ */
    .info {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      padding: 14px 18px;
      max-width: 320px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(52, 152, 219, 0.35);
      border-radius: 12px;
      box-shadow: var(--shadow);
      font-size: 12px;
      line-height: 1.55;
      color: var(--c-text-dim);
    }
    .info b { color: var(--c-text); }
    .info .ctrl {
      display: inline-block;
      padding: 1px 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      color: var(--c-text);
    }

    /* ============ 顶部状态条 ============ */
    .statusbar {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      padding: 8px 14px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      font-size: 11px;
      color: var(--c-text-dim);
      font-family: 'JetBrains Mono', 'Consolas', monospace;
    }
    .statusbar .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c-accent);
      margin-right: 6px;
      box-shadow: 0 0 8px var(--c-accent);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* ============ 详情面板（点击节点） ============ */
    .detail {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      z-index: 20;
      min-width: 320px;
      max-width: 480px;
      padding: 16px 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--c-accent);
      border-radius: 12px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    .detail.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    .detail h3 {
      margin: 0 0 4px 0;
      font-size: 16px;
      color: var(--c-accent);
    }
    .detail p {
      margin: 4px 0;
      font-size: 12px;
      line-height: 1.55;
      color: var(--c-text-dim);
    }
    .detail .close {
      position: absolute;
      top: 6px;
      right: 10px;
      cursor: pointer;
      color: var(--c-text-dim);
      font-size: 18px;
      line-height: 1;
    }
    .detail .close:hover { color: var(--c-warn); }

    /* ============ 加载动画 ============ */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--c-bg-0);
      transition: opacity 0.6s;
    }
    .loader.gone { opacity: 0; pointer-events: none; }
    .loader .ring {
      width: 64px;
      height: 64px;
      border: 3px solid rgba(26, 188, 156, 0.2);
      border-top-color: var(--c-accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader .txt {
      margin-top: 18px;
      color: var(--c-text-dim);
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* ============ 移动端响应式 ============ */
    @media (max-width: 720px) {
      .panel { left: 8px; right: 8px; top: 8px; max-width: none; min-width: 0; padding: 12px 14px; }
      .panel h1 { font-size: 15px; }
      .scene-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
      .btn { padding: 8px 6px; font-size: 11px; }
      .info { left: 8px; right: 8px; bottom: 8px; max-width: none; }
      .statusbar { display: none; }
    }
  </style>
</head>

  <!-- Three.js 主程序 -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    function mulberry32(seed) {
      return function () {
        let value = seed += 0x6D2B79F5;
        value = Math.imul(value ^ value >>> 15, value | 1);
        value ^= value + Math.imul(value ^ value >>> 7, value | 61);
        return ((value ^ value >>> 14) >>> 0) / 4294967296;
      };
    }
    const auxiliaryRandom = mulberry32(2026001);

    // ===========================================================
    // 1. 初始化场景 / 相机 / 渲染器
    // ===========================================================
    const DATA = window.CUAS_DATA;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02060c);
    scene.fog = new THREE.FogExp2(0x02060c, 0.018);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      500
    );
    camera.position.set(8, 6, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.xr.enabled = true;
    document.getElementById('scene').appendChild(renderer.domElement);

    // CSS2D 渲染器（用于中文标签）
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.getElementById('scene').appendChild(labelRenderer.domElement);

    // VR 按钮
    const vrButton = VRButton.createButton(renderer);
    vrButton.style.position = 'fixed';
    vrButton.style.bottom = '16px';
    vrButton.style.left = '50%';
    vrButton.style.transform = 'translateX(-50%)';
    vrButton.style.zIndex = '15';
    document.body.appendChild(vrButton);

    // ===========================================================
    // 2. 光照
    // ===========================================================
    scene.add(new THREE.AmbientLight(0x4a6080, 0.6));
    const hemiLight = new THREE.HemisphereLight(0x88aaff, 0x223344, 0.5);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(15, 20, 10);
    scene.add(dirLight);
    const rimLight = new THREE.PointLight(0x1abc9c, 1.2, 60);
    rimLight.position.set(-12, 6, -8);
    scene.add(rimLight);

    // 星空粒子背景
    (function addStarfield() {
      const starGeo = new THREE.BufferGeometry();
      const N = 1800;
      const positions = new Float32Array(N * 3);
      const colors = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        const r = 80 + auxiliaryRandom() * 60;
        const theta = auxiliaryRandom() * Math.PI * 2;
        const phi = Math.acos(2 * auxiliaryRandom() - 1);
        positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.cos(phi);
        positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        const c = new THREE.Color().setHSL(0.55 + auxiliaryRandom() * 0.1, 0.4, 0.6 + auxiliaryRandom() * 0.4);
        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const starMat = new THREE.PointsMaterial({ size: 0.25, vertexColors: true, transparent: true, opacity: 0.8, depthWrite: false });
      scene.add(new THREE.Points(starGeo, starMat));
    })();

    // ===========================================================
    // 3. 控制器
    // ===========================================================
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 2;
    controls.maxDistance = 60;
    controls.target.set(0, 1, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    // 移动端陀螺仪
    let gyroEnabled = false;
    function tryEnableGyro() {
      if (typeof DeviceOrientationEvent === 'undefined') return;
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => { if (state === 'granted') gyroEnabled = true; })
          .catch(() => {});
      } else {
        gyroEnabled = true;
      }
    }
    window.addEventListener('touchend', tryEnableGyro, { once: true });
    window.addEventListener('click', tryEnableGyro, { once: true });
    const gyroState = { alpha: 0, beta: 0, gamma: 0 };
    window.addEventListener('deviceorientation', (e) => {
      if (!gyroEnabled) return;
      gyroState.alpha = e.alpha || 0;
      gyroState.beta = e.beta || 0;
      gyroState.gamma = e.gamma || 0;
    });

    // ===========================================================
    // 4. 场景管理：清理 & 切换
    // ===========================================================
    const sceneGroup = new THREE.Group();
    scene.add(sceneGroup);

    const detailEl = document.getElementById('detail');
    const detailTitle = document.getElementById('detailTitle');
    const detailDesc = document.getElementById('detailDesc');
    document.getElementById('detailClose').onclick = () => detailEl.classList.remove('show');
    window.showDetail = (title, desc) => {
      detailTitle.textContent = title;
      detailDesc.textContent = desc;
      detailEl.classList.add('show');
    };

    function clearScene() {
      while (sceneGroup.children.length) {
        const obj = sceneGroup.children[0];
        sceneGroup.remove(obj);
        obj.traverse((c) => {
          if (c.geometry) c.geometry.dispose?.();
          if (c.material) {
            if (Array.isArray(c.material)) c.material.forEach(m => m.dispose?.());
            else c.material.dispose?.();
          }
          if (c instanceof CSS2DObject && c.element?.parentNode) c.element.parentNode.removeChild(c.element);
        });
      }
    }

    // 创建文字标签（CSS2D 方式，中文支持好）
    function makeLabel(text, color = '#ecf0f1', bg = 'rgba(10,21,37,0.75)', size = '11px') {
      const div = document.createElement('div');
      div.textContent = text;
      div.style.cssText = `
        padding: 3px 8px;
        background: ${bg};
        border: 1px solid ${color}55;
        border-radius: 6px;
        color: ${color};
        font-size: ${size};
        font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
        font-weight: 600;
        letter-spacing: 0.4px;
        white-space: nowrap;
        pointer-events: none;
        text-shadow: 0 0 4px rgba(0,0,0,0.8);
        box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      `;
      return new CSS2DObject(div);
    }

    // 生成 5 架入侵无人机的 3D 轨迹
    function makeIntruderFleet(n = 5) {
      const trajectoryRandom = mulberry32(2026 + n);
      const arr = [];
      for (let i = 0; i < n; i++) {
        const theta = (i / n) * Math.PI * 2 + (trajectoryRandom() - 0.5) * 0.4;
        const startR = 18 + trajectoryRandom() * 4;
        const endR = 2 + trajectoryRandom() * 4;
        const pts = [];
        const N = 30;
        for (let k = 0; k < N; k++) {
          const t = k / (N - 1);
          const r = startR + (endR - startR) * t;
          const wob = 0.4 * Math.sin(t * 4 * Math.PI);
          const x = (r + wob) * Math.cos(theta);
          const z = (r + wob) * Math.sin(theta);
          const y = 0.5 + 2.0 * Math.sin(t * Math.PI) * 0.4 + trajectoryRandom() * 0.1;
          pts.push([x, y, z]);
        }
        arr.push({ pts, class: 2 + Math.floor(trajectoryRandom() * 4) });
      }
      return arr;
    }

          pos[ot.name] = new THREE.Vector3(

            roughness: 0.25

    // 射线检测：点击节点查看详情
    const raycaster = new THREE.Raycaster();
    const mouseNDC = new THREE.Vector2();
    let isDragging = false;
    renderer.domElement.addEventListener('pointerdown', () => { isDragging = false; });
    renderer.domElement.addEventListener('pointermove', () => { isDragging = true; });
    renderer.domElement.addEventListener('pointerup', (e) => {
      if (isDragging) return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouseNDC, camera);
      const hits = raycaster.intersectObjects(sceneGroup.children, true);
      for (const h of hits) {
        if (h.object.userData?.isOT || h.object.userData?.isFW) {
          const d = h.object.userData;
          window.showDetail(`${d.name_zh} (${d.name})`, d.desc);
          // 闪烁高亮
          h.object.material.emissiveIntensity = 1.5;
          setTimeout(() => { h.object.material.emissiveIntensity = 0.45; }, 600);
          break;
        }
      }
    });

    // ===========================================================
    // 9. 主循环
    // ===========================================================
    const clock = new THREE.Clock();
    function animate() {
      const t = clock.getElapsedTime();
      const dt = clock.getDelta();
      controls.update();

      // 机场无人机沿轨迹运动
      if (sceneGroup.userData.fleet) {
        sceneGroup.userData.fleet.forEach((u, i) => {
          if (!u.drone) return;
          const phase = (t * 0.06 + i * 0.2) % 1;
          const p = u.curve.getPoint(phase);
          u.drone.position.copy(p);
        });
      }

      // 飞轮自转
      if (flywheelGroup) {
        flywheelGroup.rotation.y = t * 0.25;
        flywheelGroup.rotation.x = Math.sin(t * 0.15) * 0.15;
        // 粒子沿曲线运动
        if (flywheelGroup.userData.particles) {
          flywheelGroup.userData.particles.forEach(p => {
            p.t = (p.t + p.speed) % 1;
            const pos = p.curve.getPoint(p.t);
            p.mesh.position.copy(pos);
          });
        }
      }

      // 本体节点脉动
      ontologyNodes.forEach((n, i) => {
        const s = 1 + 0.05 * Math.sin(t * 1.5 + i);
        n.scale.setScalar(s);
      });

      // 陀螺仪微调
      if (gyroEnabled) {
        const targetX = -gyroState.gamma * 0.02;
        const targetY = -gyroState.beta * 0.02;
        camera.position.x += (targetX - camera.position.x * 0) * 0; // 留给后续扩展
      }

      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    renderer.setAnimationLoop(animate);

    // ===========================================================
    // 10. 响应式 + 关闭提示
    // ===========================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 默认场景
    setTimeout(() => {
      buildAirportScene();
      document.getElementById('loader').classList.add('gone');
    }, 300);
  </script>
</body>
</html>
