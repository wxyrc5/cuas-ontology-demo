<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🔄 贝叶斯飞轮闭环 · C-UAS 决策</title>
  <style>
    :root {
      --c-bg-0: #02060c;
      --c-bg-1: #0a1525;
      --c-accent: #ffd700;
      --c-warn: #ff5252;
      --c-text: #ecf0f1;
      --c-text-dim: #bdc3c7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at center, var(--c-bg-1) 0%, var(--c-bg-0) 70%);
      color: var(--c-text);
      font-family: 'Noto Sans CJK SC', 'Source Han Sans CN', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    canvas { display: block; }

    .header {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      padding: 14px 20px;
      background: rgba(10, 21, 37, 0.6);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid rgba(255, 215, 0, 0.4);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    .header h1 { margin: 0 0 2px 0; font-size: 16px; color: var(--c-accent); }
    .header p  { margin: 0; font-size: 11px; color: var(--c-text-dim); }

    .back {
      position: fixed; top: 16px; right: 16px; z-index: 11;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 16px;
      font-size: 13px; font-weight: 600; color: var(--c-text);
      background: rgba(10, 21, 37, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.4);
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .back:hover { background: rgba(255, 215, 0, 0.25); transform: translateY(-1px); }

    .formula {
      position: fixed; bottom: 16px; left: 16px; z-index: 10;
      padding: 12px 18px;
      background: rgba(10, 21, 37, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(136, 221, 255, 0.4);
      border-radius: 12px;
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 11px; line-height: 1.7;
      color: #88ddff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      max-width: 480px;
    }
    .formula b { color: var(--c-accent); }
    .formula .formula-row { margin: 2px 0; }

    .hint {
      position: fixed; bottom: 16px; right: 16px; z-index: 10;
      padding: 10px 14px;
      background: rgba(10, 21, 37, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.4);
      border-radius: 10px;
      font-size: 11px; color: var(--c-text-dim);
    }

    .detail {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      z-index: 20;
      min-width: 360px; max-width: 520px;
      padding: 22px 26px;
      background: rgba(10, 21, 37, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--c-accent);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    .detail.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }
    .detail .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      margin-right: 8px;
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid rgba(255, 215, 0, 0.5);
      color: var(--c-accent);
    }
    .detail h3 { margin: 6px 0 8px 0; color: var(--c-accent); font-size: 18px; }
    .detail p { margin: 6px 0; font-size: 13px; line-height: 1.6; color: var(--c-text); white-space: pre-line; }
    .detail .close {
      position: absolute; top: 8px; right: 12px;
      cursor: pointer; color: var(--c-text-dim);
      font-size: 22px; line-height: 1;
    }
    .detail .close:hover { color: var(--c-warn); }

    .loader {
      position: fixed; inset: 0; z-index: 99;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--c-bg-0);
      transition: opacity 0.6s;
    }
    .loader.gone { opacity: 0; pointer-events: none; }
    .loader .ring {
      width: 56px; height: 56px;
      border: 3px solid rgba(255, 215, 0, 0.2);
      border-top-color: var(--c-accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader .txt { margin-top: 14px; color: var(--c-text-dim); font-size: 12px; letter-spacing: 1px; }

    @media (max-width: 720px) {
      .header { left: 8px; right: 8px; top: 8px; padding: 10px 12px; }
      .header h1 { font-size: 14px; }
      .back { top: auto; bottom: 8px; right: 8px; }
      .formula { display: none; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="ring"></div>
    <div class="txt">加载贝叶斯飞轮…</div>
  </div>

  <div id="scene"></div>

  <div class="header">
    <h1>🔄 贝叶斯飞轮闭环 · C-UAS 决策</h1>
    <p>Mission → Scenario → Solution → Effect → Mission · 闭环反哺</p>
  </div>

  <a class="back" href="index.html">← 返回主菜单</a>

  <div class="formula">
    <div class="formula-row"><b>Bayes:</b>  P(θ|D) = P(D|θ)·P(θ) / P(D)</div>
    <div class="formula-row"><b>Beta prior:</b> M_k ~ Beta(α₀, β₀)</div>
    <div class="formula-row"><b>Posterior:</b> P(e_t) ~ Beta(s+2, f+2)</div>
    <div class="formula-row"><b>Objective:</b> θ* = argmax CER(t)</div>
    <div class="formula-row"><b>CER:</b> α·P_id + β·P_cov − γ·P_fa</div>
  </div>

  <div class="hint">
    <b>点击</b> 节点查看详情 · <b>拖拽</b> 旋转 · <b>滚轮</b> 缩放
  </div>

  <div class="detail" id="detail">
    <span class="close" id="detailClose">×</span>
    <span class="tag" id="detailTag">FW</span>
    <h3 id="detailTitle">—</h3>
    <p id="detailDesc">—</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const FLYWHEEL_NODES = [
      { id: 'Mission',  name_zh: '使命', color: 0x1F4E79, desc: 'M_k ~ Beta(α, β)\n作战意图 + 成功判据\n每轮迭代的先验分布' },
      { id: 'Scenario', name_zh: '场景', color: 0x2E7D32, desc: 's_t ∈ {obs, ori, dec, act}\nOODA 子序列\n观察-定向-决策-行动' },
      { id: 'Solution', name_zh: '方案', color: 0xE65100, desc: 'θ = argmax CER(t)\n武器配对 + CER 评分\n选择最优作战方案' },
      { id: 'Effect',   name_zh: '效果', color: 0xC62828, desc: 'P(e_t) ~ Beta(s+2, f+2)\n后验分布\n效果度量驱动更新' }
    ];
    const FLYWHEEL_EDGES = [
      { src: 'Mission',  tgt: 'Scenario', label: 'governs' },
      { src: 'Scenario', tgt: 'Solution', label: 'covers' },
      { src: 'Solution', tgt: 'Effect',   label: 'produces' },
      { src: 'Effect',   tgt: 'Mission',  label: 'validates', highlight: true }
    ];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02060c);
    scene.fog = new THREE.FogExp2(0x02060c, 0.012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(8, 6, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.xr.enabled = true;
    document.getElementById('scene').appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.getElementById('scene').appendChild(labelRenderer.domElement);

    const vrButton = VRButton.createButton(renderer);
    vrButton.style.position = 'fixed';
    vrButton.style.bottom = '16px';
    vrButton.style.left = '50%';
    vrButton.style.transform = 'translateX(-50%)';
    vrButton.style.zIndex = '15';
    document.body.appendChild(vrButton);

    // 光照
    scene.add(new THREE.AmbientLight(0x4a6080, 0.65));
    scene.add(new THREE.HemisphereLight(0x88aaff, 0x223344, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 1.4);
    dir.position.set(8, 14, 8);
    scene.add(dir);
    const p1 = new THREE.PointLight(0xffd700, 1.5, 40); p1.position.set(0, 0, 0);
    scene.add(p1);
    const p2 = new THREE.PointLight(0xff5252, 1.0, 30); p2.position.set(-5, -3, 0);
    scene.add(p2);

    // 星空
    (function () {
      const g = new THREE.BufferGeometry();
      const N = 2000, p = new Float32Array(N * 3), c = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        const r = 90 + Math.random() * 50;
        const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
        p[i * 3] = r * Math.sin(ph) * Math.cos(th);
        p[i * 3 + 1] = r * Math.cos(ph);
        p[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
        const col = new THREE.Color().setHSL(0.13 + Math.random() * 0.08, 0.6, 0.5 + Math.random() * 0.4);
        c[i * 3] = col.r; c[i * 3 + 1] = col.g; c[i * 3 + 2] = col.b;
      }
      g.setAttribute('position', new THREE.BufferAttribute(p, 3));
      g.setAttribute('color', new THREE.BufferAttribute(c, 3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.3, vertexColors: true, transparent: true, opacity: 0.8, depthWrite: false })));
    })();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 4;
    controls.maxDistance = 30;
    controls.target.set(0, 0, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;

    function makeLabel(text, color = '#ecf0f1', bg = 'rgba(10,21,37,0.75)', size = '11px') {
      const div = document.createElement('div');
      div.textContent = text;
      div.style.cssText = `
        padding: 3px 8px;
        background: ${bg};
        border: 1px solid ${color}55;
        border-radius: 6px;
        color: ${color};
        font-size: ${size};
        font-family: 'Noto Sans CJK SC', sans-serif;
        font-weight: 600;
        white-space: nowrap;
        pointer-events: none;
        text-shadow: 0 0 4px rgba(0,0,0,0.8);
        box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      `;
      return new CSS2DObject(div);
    }

    const fw = new THREE.Group();
    scene.add(fw);

    const R = 4.5;
    const positions = {
      Mission:  new THREE.Vector3(0,  R * 0.7,  R * 0.7),
      Scenario: new THREE.Vector3(R,  R * 0.4,  0),
      Solution: new THREE.Vector3(0, -R * 0.7,  R * 0.7),
      Effect:   new THREE.Vector3(-R, R * 0.4,  0)
    };

    const nodeMeshes = [];
    FLYWHEEL_NODES.forEach((n) => {
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.85, 32, 32),
        new THREE.MeshStandardMaterial({
          color: n.color,
          emissive: n.color,
          emissiveIntensity: 0.55,
          metalness: 0.5,
          roughness: 0.3
        })
      );
      sphere.position.copy(positions[n.id]);
      sphere.userData = { name: n.id, name_zh: n.name_zh, desc: n.desc, kind: 'FW' };
      fw.add(sphere);
      nodeMeshes.push(sphere);

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(1.2, 0.05, 8, 32),
        new THREE.MeshBasicMaterial({ color: n.color, transparent: true, opacity: 0.55 })
      );
      ring.position.copy(positions[n.id]);
      ring.rotation.x = Math.PI / 2;
      fw.add(ring);

      const lbl = makeLabel(`${n.name_zh} (${n.id})`, '#' + new THREE.Color(n.color).getHexString(), 'rgba(0,0,0,0.75)', '13px');
      const dir2 = positions[n.id].clone().normalize().multiplyScalar(1.9);
      lbl.position.copy(positions[n.id]).add(dir2);
      fw.add(lbl);
    });

    const particles = [];
    FLYWHEEL_EDGES.forEach((e) => {
      const a = positions[e.src];
      const b = positions[e.tgt];
      const mid = a.clone().add(b).multiplyScalar(0.5);
      mid.y += 1.0;
      const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
      const pts = curve.getPoints(60);
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const isHi = e.highlight;
      const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
        color: isHi ? 0xff5252 : 0xffaa00,
        transparent: true,
        opacity: isHi ? 1.0 : 0.9
      }));
      fw.add(line);

      const tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 60, isHi ? 0.08 : 0.06, 8, false),
        new THREE.MeshBasicMaterial({
          color: isHi ? 0xff5252 : 0xffaa00,
          transparent: true,
          opacity: isHi ? 0.75 : 0.6
        })
      );
      fw.add(tube);

      const midP = curve.getPoint(0.5);
      const lbl = makeLabel(`${e.label}${isHi ? ' · 🔁 反馈环' : ''}`, isHi ? '#ff8888' : '#ffcc66', 'rgba(0,0,0,0.7)', '10px');
      lbl.position.copy(midP);
      fw.add(lbl);

      // 粒子
      const particleGeo = new THREE.SphereGeometry(0.12, 8, 8);
      const particleMat = new THREE.MeshBasicMaterial({ color: isHi ? 0xff7777 : 0xffcc66 });
      const particle = new THREE.Mesh(particleGeo, particleMat);
      fw.add(particle);
      particles.push({ mesh: particle, curve, t: Math.random(), speed: 0.003 + Math.random() * 0.001 });
    });

    // 中心 P(M_success) 球
    const center = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.6, 2),
      new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 1.5, metalness: 0.7, roughness: 0.2 })
    );
    fw.add(center);
    const centerLbl = makeLabel('P(M_success) ≈ 0.92', '#ffd700', 'rgba(40,30,5,0.85)', '13px');
    centerLbl.position.set(0, 1.1, 0);
    fw.add(centerLbl);

    // 光晕
    const halo = new THREE.Mesh(
      new THREE.SphereGeometry(1.05, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.2, side: THREE.BackSide })
    );
    fw.add(halo);

    // 数学公式（在飞轮上方浮动）
    const formulaLbl = makeLabel(
      'Bayes: P(θ|D) = P(D|θ)·P(θ) / P(D)    |    CER(θ) = α·P_id + β·P_cov − γ·P_fa',
      '#88ddff', 'rgba(0,15,30,0.85)', '11px'
    );
    formulaLbl.position.set(0, 5, 0);
    fw.add(formulaLbl);

    // 装饰：圆环轨道
    const orbitRing = new THREE.Mesh(
      new THREE.TorusGeometry(5.5, 0.02, 8, 64),
      new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.2 })
    );
    orbitRing.rotation.x = Math.PI / 2;
    fw.add(orbitRing);

    // 详情弹窗
    const detailEl = document.getElementById('detail');
    const detailTag = document.getElementById('detailTag');
    const detailTitle = document.getElementById('detailTitle');
    const detailDesc = document.getElementById('detailDesc');
    document.getElementById('detailClose').onclick = () => detailEl.classList.remove('show');

    // 射线检测
    const raycaster = new THREE.Raycaster();
    const mouseNDC = new THREE.Vector2();
    let isDragging = false;
    renderer.domElement.addEventListener('pointerdown', () => { isDragging = false; });
    renderer.domElement.addEventListener('pointermove', () => { isDragging = true; });
    renderer.domElement.addEventListener('pointerup', (e) => {
      if (isDragging) return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouseNDC, camera);
      const hits = raycaster.intersectObjects(nodeMeshes, true);
      for (const h of hits) {
        if (h.object.userData?.kind === 'FW') {
          const d = h.object.userData;
          detailTag.textContent = 'FW';
          detailTitle.textContent = `${d.name_zh} (${d.name})`;
          detailDesc.textContent = d.desc;
          detailEl.classList.add('show');
          h.object.material.emissiveIntensity = 1.5;
          setTimeout(() => { h.object.material.emissiveIntensity = 0.55; }, 600);
          break;
        }
      }
    });

    // 陀螺仪
    let gyroEnabled = false;
    function tryEnableGyro() {
      if (typeof DeviceOrientationEvent === 'undefined') return;
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') gyroEnabled = true; }).catch(() => {});
      } else { gyroEnabled = true; }
    }
    window.addEventListener('touchend', tryEnableGyro, { once: true });
    window.addEventListener('click', tryEnableGyro, { once: true });
    const gyro = { beta: 0, gamma: 0 };
    window.addEventListener('deviceorientation', (e) => {
      if (!gyroEnabled) return;
      gyro.beta = e.beta || 0; gyro.gamma = e.gamma || 0;
    });

    const clock = new THREE.Clock();
    function animate() {
      const t = clock.getElapsedTime();
      controls.update();

      // 飞轮自转
      fw.rotation.y = t * 0.3;
      fw.rotation.x = Math.sin(t * 0.15) * 0.18;

      // 粒子沿曲线
      particles.forEach(p => {
        p.t = (p.t + p.speed) % 1;
        p.mesh.position.copy(p.curve.getPoint(p.t));
      });

      // 中心脉动
      const s = 1 + 0.08 * Math.sin(t * 1.8);
      center.scale.setScalar(s);
      halo.scale.setScalar(1 + 0.1 * Math.sin(t * 1.5));

      // 节点脉动
      nodeMeshes.forEach((n, i) => {
        const s2 = 1 + 0.04 * Math.sin(t * 1.5 + i * 0.8);
        const origScale = 1;
        n.scale.setScalar(origScale * s2);
      });

      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    renderer.setAnimationLoop(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    setTimeout(() => document.getElementById('loader').classList.add('gone'), 250);
  </script>
</body>
</html>
