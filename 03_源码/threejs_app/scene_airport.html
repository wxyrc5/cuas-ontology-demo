<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🛫 机场反无 · PKX 北京大兴 3D 态势</title>
  <style>
    :root {
      --c-bg-0: #02060c;
      --c-bg-1: #0a1525;
      --c-accent: #1abc9c;
      --c-warn: #e74c3c;
      --c-text: #ecf0f1;
      --c-text-dim: #bdc3c7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at top, var(--c-bg-1) 0%, var(--c-bg-0) 70%);
      color: var(--c-text);
      font-family: 'Noto Sans CJK SC', 'Source Han Sans CN', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    canvas { display: block; }

    /* 顶部场景标题 */
    .header {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      padding: 14px 20px;
      background: rgba(10, 21, 37, 0.6);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid rgba(26, 188, 156, 0.4);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    .header h1 { margin: 0 0 2px 0; font-size: 16px; color: var(--c-accent); }
    .header p  { margin: 0; font-size: 11px; color: var(--c-text-dim); }

    /* 返回按钮 */
    .back {
      position: fixed; top: 16px; right: 16px; z-index: 11;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 16px;
      font-size: 13px; font-weight: 600; color: var(--c-text);
      background: rgba(10, 21, 37, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(26, 188, 156, 0.4);
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .back:hover { background: rgba(26, 188, 156, 0.3); transform: translateY(-1px); }

    /* 右下数据卡 */
    .stats {
      position: fixed; bottom: 16px; left: 16px; z-index: 10;
      padding: 14px 18px;
      min-width: 280px;
      background: rgba(10, 21, 37, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(52, 152, 219, 0.4);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      font-size: 11px;
      line-height: 1.6;
      color: var(--c-text-dim);
    }
    .stats .row { display: flex; justify-content: space-between; gap: 8px; }
    .stats .row b { color: var(--c-text); font-weight: 600; }
    .stats .sep { border-top: 1px solid rgba(255,255,255,0.08); margin: 6px 0; }

    /* 操作提示 */
    .hint {
      position: fixed; bottom: 16px; right: 16px; z-index: 10;
      padding: 10px 14px;
      background: rgba(10, 21, 37, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(26, 188, 156, 0.4);
      border-radius: 10px;
      font-size: 11px; color: var(--c-text-dim);
    }
    .hint .k {
      display: inline-block;
      padding: 1px 6px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      font-family: monospace;
      color: var(--c-text);
      margin: 0 2px;
    }

    /* 详情弹窗 */
    .detail {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      z-index: 20;
      min-width: 360px; max-width: 500px;
      padding: 20px 24px;
      background: rgba(10, 21, 37, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--c-accent);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    .detail.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }
    .detail h3 { margin: 0 0 6px 0; color: var(--c-accent); font-size: 18px; }
    .detail p { margin: 6px 0; font-size: 13px; line-height: 1.6; color: var(--c-text); white-space: pre-line; }
    .detail .close {
      position: absolute; top: 8px; right: 12px;
      cursor: pointer; color: var(--c-text-dim);
      font-size: 22px; line-height: 1;
    }
    .detail .close:hover { color: var(--c-warn); }

    /* 加载 */
    .loader {
      position: fixed; inset: 0; z-index: 99;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--c-bg-0);
      transition: opacity 0.6s;
    }
    .loader.gone { opacity: 0; pointer-events: none; }
    .loader .ring {
      width: 56px; height: 56px;
      border: 3px solid rgba(26, 188, 156, 0.2);
      border-top-color: var(--c-accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader .txt { margin-top: 14px; color: var(--c-text-dim); font-size: 12px; letter-spacing: 1px; }

    @media (max-width: 720px) {
      .header { left: 8px; right: 8px; top: 8px; padding: 10px 12px; }
      .header h1 { font-size: 14px; }
      .back { top: auto; bottom: 8px; right: 8px; }
      .stats { display: none; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="ring"></div>
    <div class="txt">加载 3D 机场态势…</div>
  </div>

  <div id="scene"></div>

  <div class="header">
    <h1>🛫 机场反无 · PKX 北京大兴 3D 态势</h1>
    <p>5 架入侵无人机 × 4 层同心防御 × 4 类效应器</p>
  </div>

  <a class="back" href="index.html">← 返回主菜单</a>

  <div class="stats">
    <div class="row"><span>演示边界半径</span><b>55 km（非监管范围）</b></div>
    <div class="row"><span>入侵 UAV</span><b>5 架 (T1–T5)</b></div>
    <div class="row"><span>防御层数</span><b>4 层 (L1–L4)</b></div>
    <div class="sep"></div>
    <div class="row"><span>L1 远程预警</span><b style="color:#FF6B6B">75 km</b></div>
    <div class="row"><span>L2 中程+RF</span><b style="color:#FFA94D">35 km</b></div>
    <div class="row"><span>L3 光电/红外</span><b style="color:#FFD43B">12 km</b></div>
    <div class="row"><span>L4 干扰/激光</span><b style="color:#69DB7C">3 km</b></div>
  </div>

  <div class="hint">
    <span class="k">🖱️</span>左键旋转　
    <span class="k">🖲️</span>滚轮缩放　
    <span class="k">🎮</span>VR 模式
  </div>

  <div class="detail" id="detail">
    <span class="close" id="detailClose">×</span>
    <h3 id="detailTitle">—</h3>
    <p id="detailDesc">—</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    function mulberry32(seed) {
      return function () {
        let value = seed += 0x6D2B79F5;
        value = Math.imul(value ^ value >>> 15, value | 1);
        value ^= value + Math.imul(value ^ value >>> 7, value | 61);
        return ((value ^ value >>> 14) >>> 0) / 4294967296;
      };
    }
    const visualRandom = mulberry32(2026001);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02060c);
    scene.fog = new THREE.FogExp2(0x02060c, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(22, 14, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.xr.enabled = true;
    document.getElementById('scene').appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.getElementById('scene').appendChild(labelRenderer.domElement);

    const vrButton = VRButton.createButton(renderer);
    vrButton.style.position = 'fixed';
    vrButton.style.bottom = '16px';
    vrButton.style.left = '50%';
    vrButton.style.transform = 'translateX(-50%)';
    vrButton.style.zIndex = '15';
    document.body.appendChild(vrButton);

    // 光照
    scene.add(new THREE.AmbientLight(0x4a6080, 0.7));
    const hemi = new THREE.HemisphereLight(0x88aaff, 0x223344, 0.6);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 1.3);
    dir.position.set(15, 22, 12);
    scene.add(dir);
    const rim = new THREE.PointLight(0x1abc9c, 1.5, 80);
    rim.position.set(-15, 8, -10);
    scene.add(rim);

    // 星空
    (function () {
      const g = new THREE.BufferGeometry();
      const N = 2000, p = new Float32Array(N * 3), c = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        const r = 90 + visualRandom() * 50;
        const th = visualRandom() * Math.PI * 2, ph = Math.acos(2 * visualRandom() - 1);
        p[i * 3] = r * Math.sin(ph) * Math.cos(th);
        p[i * 3 + 1] = r * Math.cos(ph);
        p[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
        const col = new THREE.Color().setHSL(0.55 + visualRandom() * 0.1, 0.4, 0.55 + visualRandom() * 0.4);
        c[i * 3] = col.r; c[i * 3 + 1] = col.g; c[i * 3 + 2] = col.b;
      }
      g.setAttribute('position', new THREE.BufferAttribute(p, 3));
      g.setAttribute('color', new THREE.BufferAttribute(c, 3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.3, vertexColors: true, transparent: true, opacity: 0.85, depthWrite: false })));
    })();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 5;
    controls.maxDistance = 80;
    controls.target.set(0, 1, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;

    // 数据
    const DEFENSE_LAYERS = [
      { id: 1, name_zh: '远程预警雷达层', r_km: 75.0, color: 0xFF6B6B, alpha: 0.08 },
      { id: 2, name_zh: '中程雷达+RF层',  r_km: 35.0, color: 0xFFA94D, alpha: 0.10 },
      { id: 3, name_zh: '光电/红外层',    r_km: 12.0, color: 0xFFD43B, alpha: 0.14 },
      { id: 4, name_zh: '干扰/激光/拦截', r_km: 3.0,  color: 0x69DB7C, alpha: 0.20 }
    ];
    const NET_CLEAR_KM = 55;
    const EFFECTORS = [
      { id: 'EW_Jammer', name_zh: 'EW射频干扰',  range_km: 15.0, color: 0x9B59B6, desc: '全向射频干扰，压制 2.4 / 5.8 GHz 控制链路' },
      { id: 'HPM',       name_zh: 'HPM高功率微波', range_km: 8.0,  color: 0x8E44AD, desc: '高功率微波，烧毁无人机电子元件' },
      { id: 'HEL',       name_zh: 'HEL高能激光',  range_km: 5.0,  color: 0xE74C3C, desc: '高能激光精确烧蚀，附带损伤可控' },
      { id: 'Kinetic',   name_zh: '动能拦截弹',   range_km: 10.0, color: 0x34495E, desc: '动能拦截弹，末端近炸摧毁' }
    ];

    // CSS2D 标签
    function makeLabel(text, color = '#ecf0f1', bg = 'rgba(10,21,37,0.75)', size = '11px') {
      const div = document.createElement('div');
      div.textContent = text;
      div.style.cssText = `
        padding: 3px 8px;
        background: ${bg};
        border: 1px solid ${color}55;
        border-radius: 6px;
        color: ${color};
        font-size: ${size};
        font-family: 'Noto Sans CJK SC', sans-serif;
        font-weight: 600;
        white-space: nowrap;
        pointer-events: none;
        text-shadow: 0 0 4px rgba(0,0,0,0.8);
        box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      `;
      return new CSS2DObject(div);
    }

    const sceneGroup = new THREE.Group();
    scene.add(sceneGroup);

    // 跑道
    for (const hdgDeg of [10, 100, 170, 190]) {
      const hdg = hdgDeg * Math.PI / 180;
      const L = 3.8;
      const runway = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.01, L * 2),
        new THREE.MeshStandardMaterial({ color: 0x1B2631, roughness: 0.9 })
      );
      runway.position.y = 0.005;
      runway.rotation.y = hdg;
      sceneGroup.add(runway);
    }
    // 网格地面
    const grid = new THREE.GridHelper(80, 32, 0x1a3a5c, 0x0d2540);
    grid.position.y = -0.01;
    grid.material.transparent = true;
    grid.material.opacity = 0.4;
    sceneGroup.add(grid);

    // 4 层防御壳
    DEFENSE_LAYERS.forEach((layer, idx) => {
      const r = layer.r_km * 0.25;
      const c = new THREE.Color(layer.color);
      const sph = new THREE.Mesh(
        new THREE.SphereGeometry(r, 48, 32, 0, Math.PI * 2, 0, Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: layer.color, transparent: true, opacity: layer.alpha, side: THREE.DoubleSide, depthWrite: false })
      );
      sceneGroup.add(sph);
      // 环
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(r - 0.06, r + 0.06, 64),
        new THREE.MeshBasicMaterial({ color: layer.color, transparent: true, opacity: 0.55, side: THREE.DoubleSide })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.02;
      sceneGroup.add(ring);
      // 标签
      const lbl = makeLabel(`L${idx + 1} ${layer.name_zh} · ${layer.r_km}km`, '#' + c.getHexString());
      lbl.position.set(r * 0.6, 0.6, r * 0.6);
      sceneGroup.add(lbl);
    });

    // 55 km 参数化演示边界（非监管净空范围）
    const cylinder = new THREE.Mesh(
      new THREE.CylinderGeometry(NET_CLEAR_KM * 0.25, NET_CLEAR_KM * 0.25, 9, 64, 1, true),
      new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false })
    );
    cylinder.position.y = 4.5;
    sceneGroup.add(cylinder);
    const netLbl = makeLabel('⛔ 55 km 演示边界 · 北京大兴（非监管范围）', '#ff7777', 'rgba(30,5,5,0.85)');
    netLbl.position.set(0, 10, NET_CLEAR_KM * 0.25);
    sceneGroup.add(netLbl);

    // 4 个效应器
    const effOff = [[-10, -10], [10, -10], [10, 10], [-10, 10]];
    EFFECTORS.forEach((eff, i) => {
      const effMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.7, 0.7, 1.3, 8),
        new THREE.MeshStandardMaterial({ color: eff.color, emissive: eff.color, emissiveIntensity: 0.5, metalness: 0.7, roughness: 0.3 })
      );
      effMesh.position.set(effOff[i][0], 0.65, effOff[i][1]);
      effMesh.userData = { name: eff.name_zh, desc: eff.desc, isEff: true };
      sceneGroup.add(effMesh);

      const topMesh = new THREE.Mesh(
        new THREE.ConeGeometry(0.35, 0.6, 6),
        new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: eff.color, emissiveIntensity: 0.7 })
      );
      topMesh.position.set(effOff[i][0], 1.6, effOff[i][1]);
      sceneGroup.add(topMesh);

      const r = eff.range_km * 0.25;
      const rangeRing = new THREE.Mesh(
        new THREE.RingGeometry(r - 0.05, r + 0.05, 64),
        new THREE.MeshBasicMaterial({ color: eff.color, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false })
      );
      rangeRing.rotation.x = -Math.PI / 2;
      rangeRing.position.set(effOff[i][0], 0.04, effOff[i][1]);
      sceneGroup.add(rangeRing);

      const lbl = makeLabel(`${eff.name_zh} · ${eff.range_km}km`, '#' + new THREE.Color(eff.color).getHexString());
      lbl.position.set(effOff[i][0], 2.6, effOff[i][1]);
      sceneGroup.add(lbl);
    });

    // PKX 中心
    const pkxCore = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.6, 1),
      new THREE.MeshStandardMaterial({ color: 0x1abc9c, emissive: 0x1abc9c, emissiveIntensity: 1.2, metalness: 0.6, roughness: 0.2 })
    );
    pkxCore.position.set(0, 0.7, 0);
    sceneGroup.add(pkxCore);
    const pkxLbl = makeLabel('★ PKX · 北京大兴国际机场 (ZBAD)', '#1abc9c', 'rgba(10,30,30,0.85)', '14px');
    pkxLbl.position.set(0, 2.5, 0);
    sceneGroup.add(pkxLbl);

    // 5 架无人机
    const fleetColors = [0x27AE60, 0xF39C12, 0xE67E22, 0xE74C3C, 0xC0392B];
    const fleet = [];
    const trajectoryRandom = mulberry32(2026);
    for (let i = 0; i < 5; i++) {
      const theta = (i / 5) * Math.PI * 2 + (trajectoryRandom() - 0.5) * 0.4;
      const startR = 18 + trajectoryRandom() * 4;
      const endR = 2 + trajectoryRandom() * 4;
      const pts = [];
      const N = 30;
      for (let k = 0; k < N; k++) {
        const t = k / (N - 1);
        const r = startR + (endR - startR) * t;
        const wob = 0.4 * Math.sin(t * 4 * Math.PI);
        pts.push(new THREE.Vector3(
          (r + wob) * Math.cos(theta),
          0.5 + 2.0 * Math.sin(t * Math.PI) * 0.4 + trajectoryRandom() * 0.1,
          (r + wob) * Math.sin(theta)
        ));
      }
      const curve = new THREE.CatmullRomCurve3(pts);
      const linePts = curve.getPoints(60);
      const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
      const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: fleetColors[i], transparent: true, opacity: 0.85 }));
      sceneGroup.add(line);

      const tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 60, 0.05, 6, false),
        new THREE.MeshBasicMaterial({ color: fleetColors[i], transparent: true, opacity: 0.55 })
      );
      sceneGroup.add(tube);

      const drone = new THREE.Mesh(
        new THREE.ConeGeometry(0.2, 0.5, 4),
        new THREE.MeshStandardMaterial({ color: fleetColors[i], emissive: fleetColors[i], emissiveIntensity: 0.7, metalness: 0.6, roughness: 0.3 })
      );
      drone.position.copy(pts[pts.length - 1]);
      drone.rotation.x = -Math.PI / 2;
      drone.userData = { name: `UAV-${i+1}`, desc: `入侵无人机 ${i+1} · 威胁等级 T${2 + i % 4} · 从 ${startR.toFixed(0)}km 外接近`, isUAV: true };
      sceneGroup.add(drone);

      const lbl = makeLabel(`UAV-${i+1} · T${2 + i % 4}`, '#' + new THREE.Color(fleetColors[i]).getHexString());
      lbl.position.set(pts[pts.length - 1].x, pts[pts.length - 1].y + 0.6, pts[pts.length - 1].z);
      sceneGroup.add(lbl);

      const startSphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 8, 8),
        new THREE.MeshBasicMaterial({ color: fleetColors[i] })
      );
      startSphere.position.copy(pts[0]);
      sceneGroup.add(startSphere);

      fleet.push({ drone, curve });
    }

    // 详情弹窗
    const detailEl = document.getElementById('detail');
    const detailTitle = document.getElementById('detailTitle');
    const detailDesc = document.getElementById('detailDesc');
    document.getElementById('detailClose').onclick = () => detailEl.classList.remove('show');

    // 射线检测
    const raycaster = new THREE.Raycaster();
    const mouseNDC = new THREE.Vector2();
    let isDragging = false;
    renderer.domElement.addEventListener('pointerdown', () => { isDragging = false; });
    renderer.domElement.addEventListener('pointermove', () => { isDragging = true; });
    renderer.domElement.addEventListener('pointerup', (e) => {
      if (isDragging) return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouseNDC, camera);
      const hits = raycaster.intersectObjects(sceneGroup.children, true);
      for (const h of hits) {
        if (h.object.userData?.isEff || h.object.userData?.isUAV) {
          const d = h.object.userData;
          detailTitle.textContent = d.name;
          detailDesc.textContent = d.desc;
          detailEl.classList.add('show');
          h.object.material.emissiveIntensity = 1.5;
          setTimeout(() => { h.object.material.emissiveIntensity = 0.6; }, 600);
          break;
        }
      }
    });

    // 移动端陀螺仪
    let gyroEnabled = false;
    function tryEnableGyro() {
      if (typeof DeviceOrientationEvent === 'undefined') return;
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(s => { if (s === 'granted') gyroEnabled = true; }).catch(() => {});
      } else { gyroEnabled = true; }
    }
    window.addEventListener('touchend', tryEnableGyro, { once: true });
    window.addEventListener('click', tryEnableGyro, { once: true });
    const gyro = { beta: 0, gamma: 0 };
    window.addEventListener('deviceorientation', (e) => {
      if (!gyroEnabled) return;
      gyro.beta = e.beta || 0; gyro.gamma = e.gamma || 0;
    });

    // 主循环
    const clock = new THREE.Clock();
    function animate() {
      const t = clock.getElapsedTime();
      controls.update();

      // 沿轨迹移动
      fleet.forEach((u, i) => {
        const phase = (t * 0.05 + i * 0.2) % 1;
        u.drone.position.copy(u.curve.getPoint(phase));
      });

      // PKX 旋转
      pkxCore.rotation.y = t * 0.6;
      pkxCore.rotation.x = t * 0.3;

      // 陀螺仪
      if (gyroEnabled) {
        const targetX = -gyro.gamma * 0.015;
        const targetY = -gyro.beta * 0.015;
        camera.position.x += targetX;
        camera.position.y += targetY;
        camera.lookAt(controls.target);
      }

      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    renderer.setAnimationLoop(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });

    setTimeout(() => document.getElementById('loader').classList.add('gone'), 250);
  </script>
</body>
</html>
